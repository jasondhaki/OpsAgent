name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (DB + API) with migrations + seed
        run: pnpm exec supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - name: Generated types match SQL (rule 11)
        run: |
          pnpm db:types
          git diff --exit-code src/lib/database.types.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
